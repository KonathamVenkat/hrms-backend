name: CI

on:
  push:
    branches: [main, feature/approval-workflow]
  pull_request:

jobs:
  # Fails the run when a commit in this push or pull request contains a secret
  # (JWT secret, database password, API key...). It reads the commits only: nothing is built or run.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs the commit history, not just the latest snapshot

      - name: Scan commits for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # provided by GitHub automatically, nothing to set up

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # common-lib lives in this repo but is a separate Maven project that the backend depends on.
      - name: Build shared library (common-lib)
        run: ./mvnw -B -f common-lib/pom.xml install

      # Runs every unit test and the database tests. The database tests start a throwaway Oracle
      # container (ubuntu-latest has Docker); the schema is built from src/main/resources/db/migration.
      - name: Build and test the backend
        run: ./mvnw -B verify

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: employee-jar
          path: target/employee-*.jar
          if-no-files-found: error
