# ══════════════════════════════════════════════════════════════════════════════
# HRMS Employee Service — Application Properties
# Spring Boot 4.0.x | Oracle 23ai | Java 21
# ══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────────────────────────────────────
server.port=8082
spring.application.name=employee-service

# ─────────────────────────────────────────────────────────────────────────────
# Oracle 23ai DataSource
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/ORCLPDB1
spring.datasource.username=HRMS
spring.datasource.password=Hrms123#
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ─────────────────────────────────────────────────────────────────────────────
# HikariCP Connection Pool
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.hikari.pool-name=HrmsOraclePool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
spring.datasource.hikari.auto-commit=false

# ─────────────────────────────────────────────────────────────────────────────
# JPA / Hibernate — Oracle 23ai
# ─────────────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=0
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.order_inserts=false
spring.jpa.properties.hibernate.order_updates=false
spring.jpa.properties.hibernate.default_schema=HRMS

# ─────────────────────────────────────────────────────────────────────────────
# Jackson — camelCase JSON for Angular frontend
# ─────────────────────────────────────────────────────────────────────────────
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
#spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=NON_NULL

# ─────────────────────────────────────────────────────────────────────────────
# JWT
# ─────────────────────────────────────────────────────────────────────────────
hrms.jwt.secret=SHJtc0p3dFNlY3JldEtleUZvck9yYWNsZTIzYWlIUk1TU3lzdGVtMjAyNA==
hrms.jwt.expiration-ms=86400000
hrms.jwt.refresh-expiration-ms=604800000

# ─────────────────────────────────────────────────────────────────────────────
# CORS — Angular Dev Server
# ─────────────────────────────────────────────────────────────────────────────
#hrms.cors.allowed-origins=http://localhost:4200

# ─────────────────────────────────────────────────────────────────────────────

# Actuator
# ─────────────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ─────────────────────────────────────────────────────────────────────────────
# SpringDoc / Swagger UI
# ─────────────────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.hrms=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.ai.openai.api-key=DISABLED

app.upload.dir=uploads/employee-documents
app.base-url=http://localhost:8082
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB