# Used by the tests only. It replaces the real application.properties (which is gitignored, so it is
# not there on a build server), so every value here is a harmless test value. The database comes from
# the throwaway Oracle container (see DatabaseTest); nothing here points at a real database.
spring.application.name=employee-service
spring.datasource.hikari.auto-commit=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=HRMS
spring.jpa.properties.hibernate.jdbc.batch_size=0

spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.default-property-inclusion=NON_NULL

hrms.jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9uLTAxMjM0NTY3ODk=
hrms.jwt.expiration-ms=86400000
hrms.jwt.refresh-expiration-ms=604800000
hrms.cors.allowed-origins=http://localhost:4200
hrms.work-email-domain=example.test
hrms.business-zone=Africa/Juba

app.upload.dir=target/test-uploads/employee-documents
app.leave-upload.dir=target/test-uploads/leave-attachments
app.base-url=http://localhost:8082

spring.flyway.baseline-version=1
management.endpoints.web.exposure.include=health
